<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" id="mascot" role="img" aria-labelledby="mascot-title">
<title id="mascot-title">Bouncing mascot</title>
<style>
#mascot .frame{visibility:hidden;animation-duration:1.0000s;animation-timing-function:step-end;animation-iteration-count:infinite;animation-fill-mode:forwards}
#mascot .f0{animation-name:mascot-f0}
#mascot .f1{animation-name:mascot-f1}
#mascot .f2{animation-name:mascot-f2}
#mascot .f3{animation-name:mascot-f3}
#mascot .f4{animation-name:mascot-f4}
#mascot .f5{animation-name:mascot-f5}
#mascot .f6{animation-name:mascot-f6}
@keyframes mascot-f0{0%{visibility:visible}12.5%{visibility:hidden}}
@keyframes mascot-f1{12.5%{visibility:hidden}12.5%{visibility:visible}25%{visibility:hidden}}
@keyframes mascot-f2{25%{visibility:hidden}25%{visibility:visible}37.5%{visibility:hidden}}
@keyframes mascot-f3{37.5%{visibility:hidden}37.5%{visibility:visible}50%{visibility:hidden}}
@keyframes mascot-f4{50%{visibility:hidden}50%{visibility:visible}62.5%{visibility:hidden}}
@keyframes mascot-f5{62.5%{visibility:hidden}62.5%{visibility:visible}75%{visibility:hidden}}
@keyframes mascot-f6{75%{visibility:hidden}75%{visibility:visible}}
#mascot .f0{visibility:visible}
@media (prefers-reduced-motion: reduce){#mascot .frame{animation:none;visibility:hidden}#mascot .f0{visibility:visible}}
</style>
